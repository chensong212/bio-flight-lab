{{ define "main" }}
  <div class="post">
    <p class="post-date">{{ .Date.Format "2006-01-02" }}{{ with .Params.project }} · {{ . }}{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.tags }}<div class="post-tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</div>{{ end }}
    <div class="post-body">{{ .Content }}</div>
  </div>
{{ end }}
