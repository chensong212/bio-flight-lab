{{ define "main" }}
  <div class="project">
    <p class="post-date">Status: {{ with .Params.status }}{{ . }}{{ else }}active{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.tags }}<div class="post-tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</div>{{ end }}
    <div class="post-body">{{ .Content }}</div>
  </div>
{{ end }}
